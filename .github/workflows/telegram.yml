name: Telegram

# Natychmiastowe powiadomienia po zmianie sygnałów lub dziennika (push do panel/projekt/)
# oraz ręczne uruchomienie: test połączenia albo podsumowanie rynków.
# W zwykłym rytmie co 15 min powiadomienia wysyła też workflow „Ceny Yahoo”.
on:
  push:
    branches: [main]
    paths: ["panel/projekt/**"]
  workflow_dispatch:
    inputs:
      co:
        description: "Co wysłać"
        type: choice
        options: [test, podsumowanie, zdarzenia]
        default: test

permissions:
  contents: write

concurrency:
  group: telegram
  cancel-in-progress: false

jobs:
  wyslij:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wyślij
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TRYB: ${{ vars.TELEGRAM_TRYB }}
        run: |
          CO="${{ github.event.inputs.co }}"
          if [ "$CO" = "test" ] || [ "$CO" = "podsumowanie" ]; then python panel/telegram.py "$CO"; else python panel/telegram.py; fi
      - name: Zapisz stan powiadomień
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/telegram_stan.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "telegram: stan powiadomień"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done
          exit 1
