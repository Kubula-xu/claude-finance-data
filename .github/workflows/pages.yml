name: Pulpit (GitHub Pages)

# Buduje statyczny pulpit Claude Finance i publikuje go na GitHub Pages:
# po każdym pobraniu cen (workflow „Ceny Yahoo”), po zmianie pozycji/raportów w panel/ i ręcznie.
on:
  workflow_run:
    workflows: ["Ceny Yahoo"]
    types: [completed]
  push:
    branches: [main]
    paths: ["panel/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python panel/build.py _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
