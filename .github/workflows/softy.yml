name: Softy (kawa i kakao)

# Fundamenty kawy i kakao (COT, pogoda w regionach upraw, krzywa kontraktów, FX, sezonowość, zapasy ICE)
# do data/softy/, potem analiza (softy/analiza.py). Analizę bez pobierania liczy też workflow „Ceny Yahoo” co 15 min.
on:
  schedule:
    # pn-pt 06:20 UTC (przed otwarciem ICE), 18:10 UTC (po zamknięciu softów, raporty ICE),
    # pt 20:00 UTC (COT wychodzi o 19:30 UTC), nd 21:00 UTC (stan na poniedziałek)
    - cron: "20 6 * * 1-5"
    - cron: "10 18 * * 1-5"
    - cron: "0 20 * * 5"
    - cron: "0 21 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: softy
  cancel-in-progress: false

jobs:
  softy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pobranie fundamentów
        run: python softy/fetch_softy.py || echo "część źródeł nie zadziałała (data/softy/status.json)"
      - name: Analiza
        run: python softy/analiza.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/softy
          git diff --cached --quiet && exit 0
          git commit -m "softy $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done
          exit 1
